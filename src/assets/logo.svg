<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DFD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- scan frame -->
  <path d="M14 22 v-6 a2 2 0 0 1 2-2 h6" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 14 h6 a2 2 0 0 1 2 2 v6" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 42 v6 a2 2 0 0 1-2 2 h-6" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M22 50 h-6 a2 2 0 0 1-2-2 v-6" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <!-- text lines (parsed order) -->
  <rect x="20" y="26" width="24" height="3.5" rx="1.75" fill="#F8FAFC"/>
  <rect x="20" y="34" width="17" height="3.5" rx="1.75" fill="#94A3B8"/>
  <rect x="20" y="42" width="21" height="3.5" rx="1.75" fill="#94A3B8"/>
  <!-- scan beam -->
  <rect x="16" y="23" width="32" height="2.5" rx="1.25" fill="#4F8DFD" opacity="0.9"/>
</svg>
